<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seizure detection device benefit check</title>
<style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;padding:18px;color:#232020;background:#fcfcfb;max-width:720px}h2{font-size:20px;margin:0 0 8px}.q{font-size:18px;margin:14px 0}.btn{display:inline-block;margin:6px 8px 6px 0;padding:10px 16px;border:2px solid #b3202c;border-radius:8px;background:#fff;color:#b3202c;font-size:16px;cursor:pointer}.btn:hover{background:#b3202c;color:#fff}.ans{margin-top:14px;padding:16px;background:#fff;border-left:5px solid #1a9850;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.08);line-height:1.5}.maybe{border-left-color:#fdae61}.small{font-size:13px;color:#5d5851;margin-top:12px}ol{margin:8px 0 0 18px}</style></head><body>
<h2>Could a seizure detection device be covered for my child?</h2><div id="app"></div>
<script>
const S=[
{q:"Is the person covered by Minnesota Medical Assistance (Medicaid) or MinnesotaCare?",y:1,n:"noma"},
{q:"Do they have a diagnosis of epilepsy with convulsive (tonic-clonic) seizures?",y:2,n:"nonconv"},
{q:"Do seizures happen at night, when alone, or without warning, so that a faster alert would reduce the chance of injury?",y:3,n:"data"},
{q:"Have they received a covered seizure detection device in the last five years?",y:"five",n:"yes"}];
const R={
yes:{c:"",t:"<strong>This fits the coverage criteria.</strong> Since January 1, 2024, Minnesota Medical Assistance covers one FDA-cleared seizure detection device every five years for a member with convulsive seizures and active epilepsy when a provider documents that it is likely to reduce harm or provide data for treatment (Minn. Stat. 256B.0625, subd. 31). Next steps:<ol><li>Ask the neurologist or epilepsy clinic: \"Would a seizure detection device help, and will you write the order?\"</li><li>The clinic or a DHS-enrolled equipment supplier submits it, with prior authorization if the plan requires it.</li><li>If denied, appeal. The Epilepsy Foundation of Minnesota (651-287-2300) can help.</li><li>Tell the school nurse it exists so it goes in the seizure action plan.</li></ol>"},
data:{c:"maybe",t:"<strong>Possibly.</strong> The benefit also covers a device that gives the provider data needed to diagnose or treat the seizures, even when injury risk is lower. Ask the neurologist whether seizure-count data would change treatment. If so, they can document that as the reason."},
nonconv:{c:"maybe",t:"<strong>Probably not under this benefit, and the device may not help.</strong> Wrist devices detect convulsive seizures by movement and skin changes. They do not detect absence seizures or most focal seizures. Ask the neurologist what monitoring, if any, fits this seizure type."},
five:{c:"maybe",t:"<strong>Coverage is one device every five years.</strong> If the current device is broken or outgrown, ask the supplier about repair or replacement under warranty, and ask the clinic whether an exception request is possible."},
noma:{c:"maybe",t:"<strong>Not through Medical Assistance today, but two doors are open.</strong> A child with a certified disability may qualify for MA through TEFRA regardless of parents' income; ask your county human services office. Many employer plans cover devices with a letter of medical necessity; ask the clinic to write one and ask the plan for its durable medical equipment policy in writing."}};
const app=document.getElementById('app');function step(i){const s=S[i];app.innerHTML=`<div class="q">${i+1}. ${s.q}</div><span class="btn" onclick="ans(${i},true)">Yes</span><span class="btn" onclick="ans(${i},false)">No</span><span class="btn" onclick="ans(${i},null)">Not sure</span>${foot()}`;}
function ans(i,v){const s=S[i];const nx=v===true?s.y:(v===false?s.n:(typeof s.y==='number'?s.y:'yes'));typeof nx==='number'?step(nx):done(nx);}
function done(k){const r=R[k];app.innerHTML=`<div class="ans ${r.c}">${r.t}</div><span class="btn" style="margin-top:14px" onclick="step(0)">Start over</span>${foot()}`;}
function foot(){return `<div class="small">A learning tool, not medical advice or a coverage decision. Only the plan decides coverage; only the neurologist decides whether a device fits. No device has been proven to prevent SUDEP; good seizure control and nighttime supervision lower risk, and a device supports supervision.</div>`;}step(0);</script></body></html>
