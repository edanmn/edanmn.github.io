<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pharmacy Problem Solver</title>
<style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;padding:18px;color:#232020;background:#fcfcfb;max-width:720px}h2{font-size:20px;margin:0 0 8px}.q{font-size:18px;margin:14px 0}.btn{display:inline-block;margin:6px 8px 6px 0;padding:10px 16px;border:2px solid #b3202c;border-radius:8px;background:#fff;color:#b3202c;font-size:16px;cursor:pointer}.btn:hover{background:#b3202c;color:#fff}.ans{margin-top:14px;padding:16px;background:#fff;border-left:5px solid #1a9850;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.08);line-height:1.5}.warn{border-left-color:#b3202c}.small{font-size:13px;color:#5d5851;margin-top:12px}a{color:#b3202c}</style></head><body>
<h2>The pharmacy can't fill my seizure medicine. What now?</h2><div id="app"></div>
<script>
const T={
start:{q:"What did the pharmacy tell you?",o:[["We're out of stock","stock"],["It needs prior authorization or the plan won't cover it","cover"],["It costs more than we can pay","cost"],["There's a national shortage","short"],["We're too far from any pharmacy","far"]]},
stock:{q:"Is this your pharmacy's stock, or every pharmacy?",o:[["Just this store","xfer"],["They said it's everywhere","short"],["I don't know","askph"]]},
askph:{a:"Ask the pharmacist two questions: \"Is this a national shortage or just your stock?\" and \"Can you see inventory at other stores in your chain?\" Most chains can transfer a prescription in a day. If they say national shortage, go to the shortage steps."},
xfer:{a:"Ask the pharmacist to transfer the prescription to a nearby store that has it, or call an independent pharmacy. Independents often use a different wholesaler and have stock when chains do not. Find one through Minnesota Independent Pharmacists or call the Epilepsy Foundation of Minnesota, 651-287-2300."},
cover:{q:"How many doses do you have left?",o:[["Three days or fewer","emerg"],["More than three days","pa"]]},
emerg:{a:"Say the words \"emergency supply.\" Minnesota Medical Assistance and most plans allow a 72-hour emergency fill while prior authorization is sorted out. Then call the prescriber today so the authorization goes in. Do not skip doses while you wait.",w:1},
pa:{a:"Call the prescriber's office and ask them to submit the prior authorization today; ask the pharmacy to note the date it was requested. Minnesota law gives you a step-therapy exception process if the plan wants you to try a different drug first. If you are on Medical Assistance, the DHS Member Help Desk (651-431-2670) can tell you the status."},
cost:{q:"What kind of insurance?",o:[["Medical Assistance or MinnesotaCare","ma"],["Employer or marketplace plan","comm"],["None","none"]]},
ma:{a:"Copays under Medical Assistance are $0 to a few dollars for most seizure drugs. If you were charged more, the claim may have run wrong; ask the pharmacist to rebill, and call the Member Help Desk, 651-431-2670. A child with a disability may qualify for MA through TEFRA regardless of parents' income."},
comm:{a:"Three things to try today: a manufacturer assistance or copay program (search the drug name plus \"patient assistance,\" or use NeedyMeds, 800-503-6897); a discount card price on a generic (ask the pharmacist to compare); and a 90-day fill, which often costs less per month. Minnesota bill HF 3652 / SF 3786 would cap epilepsy drug cost-sharing at $25 a month starting 2027; it has not passed yet."},
none:{a:"Apply for Medical Assistance or MinnesotaCare through MNsure or your county; coverage can be backdated. In the meantime, manufacturer patient assistance programs cover uninsured people for most brand-name seizure drugs, and NeedyMeds (needymeds.org) lists them. Ask the clinic social worker for help with the forms."},
short:{a:"Call the prescriber the same day. Ask: \"Is there a different strength or form (liquid, tablet, sprinkle) you would accept, or a therapeutic alternative?\" Two strengths of the same drug can often be combined. Never substitute or split doses on your own. Check the FDA drug shortage list for the expected end date, and ask for a 90-day supply once it is back.",w:1},
far:{a:"Use your plan's mail-order pharmacy and order two weeks early; seizure medicine should never run to the last pill. Ask the clinic whether a rural clinic dispensary or a chain's delivery service reaches you. Keep a five-day emergency supply if the prescriber and plan allow it, and tell the school nurse if a refill is delayed so the seizure action plan says what to do."}};
const app=document.getElementById('app');function go(k){const n=T[k];let h='';if(n.q){h+=`<div class="q">${n.q}</div>`;n.o.forEach(([l,t])=>h+=`<span class="btn" onclick="go('${t}')">${l}</span>`);}
if(n.a){h+=`<div class="ans ${n.w?'warn':''}">${n.a}</div>`;h+=`<span class="btn" style="margin-top:14px" onclick="go('start')">Start over</span>`;}
h+=`<div class="small">A learning tool, not medical advice. Never stop or change a seizure medicine without talking to the prescriber; stopping suddenly can cause seizures. If a seizure will not stop, call 911.</div>`;app.innerHTML=h;}go('start');</script></body></html>
