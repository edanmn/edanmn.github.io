site_name: Epilepsy Data & Advocacy Network (EDAN)
site_description: "Epilepsy data that nobody else has assembled. We find public information that is buried, hard to reach or scattered across hundreds of documents, and publish it in one place with the method attached. School seizure readiness, what seizure medicines cost, distance to specialist care, and what the state's own numbers show. Starting in Minnesota. Student-led, free, and sourced."
site_author: Rishik Kondadadi, Epilepsy Data & Advocacy Network (EDAN)
# Set these two when you create the GitHub repo:
site_url: https://edanmn.org/

theme:
  name: material
  custom_dir: overrides
  logo: img/brand/edan-icon-96.png
  favicon: img/brand/favicon-48.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.tooltips
    - toc.follow

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - footnotes
  - tables
  - toc:
      permalink: true

plugins:
  - search

extra_css:
  # Bump the version after CSS changes so browsers fetch the new file right away.
  - css/extra.css?v=2026-09-25

extra_javascript:
  - js/reactbits.js?v=2026-09-24

nav:
  - Home: index.md
  - About EDAN: about.md
  - 'Initiatives':
    - 'Overview': initiatives/index.md
    - '1. Seizure-Safe Schools': initiatives/seizure-safe-schools.md
    - '2. The State''s Epilepsy Data': initiatives/state-epilepsy-data.md
    - '3. Medication Access': initiatives/medication-access.md
    - '4. Distance to Care': initiatives/care-access.md
    - '5. SUDEP': initiatives/sudep.md
  - In Your Language: in-your-language/index.md
  - Find Your District: find-your-district/index.md
  - 'Tell Us What Your District Has': programs/report-your-district/index.md
  - 'Chapters':
    - 'Seizure First Aid': chapters/02-seizure-first-aid/index.md
    - 'The Minnesota Law (121A.24)': chapters/03-minnesota-law/index.md
    - 'Seizure Action Plans': chapters/04-seizure-action-plans/index.md
    - 'The Audit: Mapping the Gaps': chapters/05-the-data-case-study/index.md
    - 'How to Ask Your School': chapters/06-how-to-help/index.md
    - 'Your Child''s Rights (504/IEP)': chapters/07-your-childs-rights/index.md
    - 'For Schools: In Practice': chapters/08-for-schools-in-practice/index.md
    - 'Driving in Minnesota': chapters/10-driving-in-minnesota/index.md
    - 'Paying for Epilepsy Care': chapters/11-paying-for-epilepsy-care/index.md
    - 'Medicines: What to Ask, What They Cost': chapters/12-medicines-for-epilepsy/index.md
    - 'Getting Specialist Care': chapters/16-when-the-first-medicine-does-not-work/index.md
  - 'Interactive Sims':
    - 'Seizure First Aid Simulator': sims/seizure-first-aid/index.md
    - 'Is This a Seizure?': sims/recognize-seizure/index.md
    - 'On the Phone with 911': sims/call-911/index.md
    - '504 vs IEP Path-Finder': sims/504-vs-iep/index.md
    - 'Distance to Care Lookup': sims/distance-lookup/index.md
    - 'Pharmacy Problem Solver': sims/pharmacy-problem/index.md
    - 'Device Benefit Check': sims/device-benefit-check/index.md
  - Resources & Support: resources/index.md
  - FAQ: faq.md
  - Glossary: glossary.md
