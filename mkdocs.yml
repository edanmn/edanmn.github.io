site_name: Epilepsy Data & Advocacy Network (EDAN)
site_description: "Epilepsy data that nobody else has assembled. We find public information that is buried, hard to reach or scattered across hundreds of documents, and publish it in one place with the method attached. School seizure readiness, what seizure medicines cost, distance to specialist care, and what the state's own numbers show. Starting in Minnesota. Student-led, free, and sourced."
site_author: Rishik Kondadadi, Epilepsy Data & Advocacy Network (EDAN)
# Set these two when you create the GitHub repo:
site_url: https://edanmn.org/

theme:
  name: material
  custom_dir: overrides
  logo: img/brand/edan-icon-96.png
  favicon: img/brand/favicon-48.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    # Fetch a page when the pointer reaches its link, and show a bar if a load is slow.
    - navigation.instant.prefetch
    - navigation.instant.progress
    # Breadcrumbs above the title on nested pages: where am I, and how do I get back.
    - navigation.path
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.tooltips
    - toc.follow

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - footnotes
  - tables
  - toc:
      permalink: true

plugins:
  - search

extra_css:
  # Bump the version after CSS changes so browsers fetch the new file right away.
  - css/extra.css?v=2026-10-08d

extra_javascript:
  - js/reactbits.js?v=2026-10-08d

# The quiz is reached from the button at the end of the law page, not from the menu.
not_in_nav: |
  chapters/03-minnesota-law/quiz.md

nav:
  - Home: index.md
  - 'Find Your District':
    - 'School District': find-your-district/index.md
    - 'Legislative District': legislative-districts/index.md
    - 'County': counties/index.md
    - 'Tell Us What Your District Has': programs/report-your-district/index.md
  - 'Initiatives':
    - 'Overview': initiatives/index.md
    - '1. Seizure-Safe Schools': initiatives/seizure-safe-schools.md
    - 'Compare Your District': sims/district-compare/index.md
    - '2. Medication Access': initiatives/medication-access.md
    - 'What a $25 Cap Would Change': sims/cap-calculator/index.md
    - '3. SUDEP': initiatives/sudep.md
    - 'Death Certificate Explorer': sims/death-certificates/index.md
  - 'Law and Data':
    - 'The Minnesota Law (121A.24)': chapters/03-minnesota-law/index.md
    - 'The Audit: Mapping the Gaps': chapters/05-the-data-case-study/index.md
    - 'Distance to Care Map': initiatives/care-access.md
    - 'Distance to Care Lookup': sims/distance-lookup/index.md
    - 'Data and Methods': data/index.md
  - 'Help and Resources':
    - 'Resources & Support': resources/index.md
    - 'In Your Language': in-your-language/index.md
    - 'FAQ': faq.md
    - 'Glossary': glossary.md
  - About EDAN: about.md
