site_name: Epilepsy Data & Advocacy Network (EDAN)
site_description: Free tools and plain-language information for Minnesota students with epilepsy and their families. Seizure safety, IEP and 504 guidance, students' rights, school resources, and research in plain language — all student-led, all free.
site_author: Rishik Kondadadi, Epilepsy Data & Advocacy Network (EDAN)
# Set these two when you create the GitHub repo:
site_url: https://edanmn.github.io/
repo_url: https://github.com/edanmn/edanmn.github.io
repo_name: edanmn/edanmn.github.io
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  logo: img/brand/edan-icon-96.png
  favicon: img/brand/favicon-48.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.action.edit
    - content.tooltips
    - toc.follow

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true

plugins:
  - search

extra_css:
  # Bump the version after CSS changes so browsers fetch the new file right away.
  - css/extra.css?v=2026-09-19a

extra_javascript:
  - js/reactbits.js

nav:
  - Home: index.md
  - About EDAN: about.md
  - 'Initiatives':
    - 'Overview': initiatives/index.md
    - '1. Seizure-Safe Schools': initiatives/seizure-safe-schools.md
    - '2. The State''s Epilepsy Data': initiatives/state-epilepsy-data.md
    - '3. Medication Access': initiatives/medication-access.md
    - '4. Distance to Care': initiatives/care-access.md
    - '5. SUDEP': initiatives/sudep.md
  - For Students: for-students/index.md
  - In Your Language: in-your-language/index.md
  - Find Your District: find-your-district/index.md
  - 'Programs':
    - 'Seizure-Smart Classroom': programs/seizure-smart-classroom/index.md
    - 'Student Peer-Awareness Toolkit': programs/peer-awareness/index.md
    - 'Is Your School Trained?': programs/staff-training/index.md
  - 'Chapters':
    - '0. Introduction': chapters/00-introduction/index.md
    - '1. Understanding Epilepsy': chapters/01-understanding-epilepsy/index.md
    - '2. Seizure First Aid': chapters/02-seizure-first-aid/index.md
    - '3. The Minnesota Law (121A.24)': chapters/03-minnesota-law/index.md
    - '4. Seizure Action Plans': chapters/04-seizure-action-plans/index.md
    - '5. The Data: Mapping the Gaps': chapters/05-the-data-case-study/index.md
    - '6. How to Help': chapters/06-how-to-help/index.md
    - '7. Your Child''s Rights (504/IEP)': chapters/07-your-childs-rights/index.md
    - '8. For Schools: In Practice': chapters/08-for-schools-in-practice/index.md
    - '9. Everyday Safety & Living': chapters/09-everyday-safety/index.md
  - 'Interactive Sims':
    - 'Seizure First Aid Simulator': sims/seizure-first-aid/index.md
    - 'Is This a Seizure?': sims/recognize-seizure/index.md
    - 'On the Phone with 911': sims/call-911/index.md
    - '504 vs IEP Path-Finder': sims/504-vs-iep/index.md
    - 'Distance to Care Lookup': sims/distance-lookup/index.md
    - 'Pharmacy Problem Solver': sims/pharmacy-problem/index.md
    - 'Device Benefit Check': sims/device-benefit-check/index.md
  - Resources & Support: resources/index.md
  - Research, Translated: research-translated/index.md
  - FAQ: faq.md
  - Glossary: glossary.md
